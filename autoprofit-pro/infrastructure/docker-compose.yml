version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: autoprofit-db
    restart: always
    environment:
      POSTGRES_DB: autoprofit
      POSTGRES_USER: autoprofit_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - autoprofit-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: autoprofit-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - autoprofit-network

  # Backend API
  api:
    build:
      context: ./apps/api
      dockerfile: ../../infrastructure/docker/Dockerfile.api
    container_name: autoprofit-api
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      ENVIRONMENT: production
    depends_on:
      - postgres
      - redis
    volumes:
      - ./apps/api:/app
    networks:
      - autoprofit-network

  # Z.ai Engine
  z-ai:
    build:
      context: ./apps/z-ai
      dockerfile: ../../infrastructure/docker/Dockerfile.z-ai
    container_name: autoprofit-z-ai
    restart: always
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      MODEL_PATH: /models
    volumes:
      - ./apps/z-ai:/app
      - ai_models:/models
    depends_on:
      - postgres
      - redis
    networks:
      - autoprofit-network

  # Celery Worker
  celery-worker:
    build:
      context: ./apps/api
      dockerfile: ../../infrastructure/docker/Dockerfile.api
    container_name: autoprofit-celery
    restart: always
    command: celery -A src.core.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
      - api
    networks:
      - autoprofit-network

  # Web Frontend
  web:
    build:
      context: ./apps/web
      dockerfile: ../../infrastructure/docker/Dockerfile.web
    container_name: autoprofit-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000
      NEXT_PUBLIC_Z_AI_URL: http://z-ai:8001
      NEXT_PUBLIC_WS_URL: ws://api:8000/ws
    depends_on:
      - api
      - z-ai
    networks:
      - autoprofit-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: autoprofit-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - web
      - api
    networks:
      - autoprofit-network

  # Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: autoprofit-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - autoprofit-network

  grafana:
    image: grafana/grafana:latest
    container_name: autoprofit-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - autoprofit-network

networks:
  autoprofit-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  ai_models:
  grafana_data:
